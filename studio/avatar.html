<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Garamond'; src: url('node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-400-italic.woff2') format('woff2'); font-weight: 400; font-style: italic; }
  @font-face { font-family: 'Inter'; src: url('node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: 'Inter'; src: url('node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2') format('woff2'); font-weight: 800; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script>
// Photo de profil de la chaîne « Et si… ? » : trois pistes (?v=A, B ou C), toujours lisibles une fois rognées en rond
const v = new URLSearchParams(location.search).get('v') || 'A';
const c = document.getElementById('c'), g = c.getContext('2d'), S = 1080, M = S / 2;
const ACC = '#ffcf6b';
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function night() {   // le fond : nuit bleu profond, quelques étoiles
  const gr = g.createRadialGradient(M, M * 0.8, 50, M, M, S * 0.75); gr.addColorStop(0, '#16224a'); gr.addColorStop(1, '#03050d');
  g.fillStyle = gr; g.fillRect(0, 0, S, S);
  const r = rng(7); for (let i = 0; i < 140; i++) { g.fillStyle = `rgba(255,255,255,${0.25 + r() * 0.6})`; const s = r() < 0.12 ? 3 : 2; g.fillRect(r() * S, r() * S, s, s); }
}
function reticle(m, len, lw, col = 'rgba(255,255,255,0.92)') {   // les coins du viseur de caméra
  g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'square';
  const a = m, b = S - m;
  [[a, a, 1, 1], [b, a, -1, 1], [a, b, 1, -1], [b, b, -1, -1]].forEach(([x, y, sx, sy]) => { g.beginPath(); g.moveTo(x, y + sy * len); g.lineTo(x, y); g.lineTo(x + sx * len, y); g.stroke(); });
}
function live(x, y, size) {   // ● LIVE
  g.fillStyle = '#ff3b30'; g.beginPath(); g.arc(x, y, size * 0.42, 0, 7); g.fill();
  g.font = `600 ${size}px Inter`; g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText('LIVE', x + size * 0.8, y + size * 0.04); g.textBaseline = 'alphabetic';
}
function earth(cx, cy, R, ring) {
  if (ring) band(cx, cy, R, 'back');
  g.save(); g.beginPath(); g.arc(cx, cy, R, 0, 7); g.clip();
  const oc = g.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.1, cx, cy, R * 1.05); oc.addColorStop(0, '#4f9be8'); oc.addColorStop(0.6, '#1d5cb4'); oc.addColorStop(1, '#0a2a66');
  g.fillStyle = oc; g.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  // des continents dessinés à la main (formes libres, pas une vraie carte)
  g.fillStyle = '#3f8a48';
  const blob = (pts) => { const P = pts.map(([px, py]) => [cx + px * R, cy + py * R]), n = P.length; g.beginPath();
    g.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
    for (let i = 0; i < n; i++) { const a = P[i], b = P[(i + 1) % n]; g.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); } g.fill(); };
  blob([[-0.55, -0.55], [-0.2, -0.62], [-0.05, -0.4], [-0.22, -0.18], [-0.12, 0.05], [-0.3, 0.25], [-0.45, 0.05], [-0.62, -0.2]]);
  blob([[0.12, -0.35], [0.45, -0.45], [0.62, -0.2], [0.5, 0.05], [0.32, 0.0], [0.25, 0.3], [0.38, 0.6], [0.18, 0.7], [0.05, 0.35], [0.08, 0.0]]);
  g.fillStyle = '#b8a06a'; blob([[0.3, -0.3], [0.45, -0.32], [0.5, -0.18], [0.36, -0.12]]);
  g.fillStyle = 'rgba(255,255,255,0.45)'; const r = rng(3);
  for (let i = 0; i < 6; i++) { g.beginPath(); g.ellipse(cx + (r() - 0.5) * 1.5 * R, cy + (r() - 0.5) * 1.5 * R, R * (0.15 + r() * 0.2), R * 0.05, -0.3 + r() * 0.3, 0, 7); g.fill(); }

  // la nuit sur la droite
  const sh = g.createLinearGradient(cx - R * 0.2, 0, cx + R, 0); sh.addColorStop(0, 'rgba(0,0,10,0)'); sh.addColorStop(1, 'rgba(0,0,10,0.75)');
  g.fillStyle = sh; g.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  g.restore();
  const at = g.createRadialGradient(cx, cy, R * 0.99, cx, cy, R * 1.07); at.addColorStop(0, 'rgba(140,195,255,0.6)'); at.addColorStop(1, 'rgba(120,180,255,0)');
  g.fillStyle = at; g.beginPath(); g.arc(cx, cy, R * 1.07, 0, 7); g.fill();
  if (ring) band(cx, cy, R, 'front');
}
function band(cx, cy, R, part) {   // les anneaux (moitié arrière derrière la planète, moitié avant devant)
  g.save(); g.translate(cx, cy); g.rotate(-0.38);
  const rx = R * 1.95, ry = R * 0.42;
  g.beginPath(); if (part === 'back') g.rect(-rx * 1.2, -ry * 1.5, rx * 2.4, ry * 1.5); else g.rect(-rx * 1.2, 0, rx * 2.4, ry * 1.5); g.clip();
  for (let k = 0; k < 26; k++) { const f = 1.25 + k * 0.028; g.strokeStyle = `rgba(${235 - k * 2},${215 - k * 3},${175 - k * 3},${k % 5 === 3 ? 0.18 : 0.62})`; g.lineWidth = R * 0.03; g.beginPath(); g.ellipse(0, 0, R * f * 1.07, R * f * 0.23, 0, 0, 7); g.stroke(); }
  g.restore();
}

(async () => {
  await document.fonts.load("800 100px Inter"); await document.fonts.load("600 100px Inter"); await document.fonts.load("italic 400 100px Garamond");
  if (v === 'A') {   // le crochet de nos vidéos : « Et si… ? »
    night(); reticle(205, 120, 16);
    g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = '800 250px Inter'; g.fillText('Et si', M, 560);
    g.font = '800 250px Inter'; const w1 = g.measureText('…\u202f').width, w2 = g.measureText('?').width;
    g.textAlign = 'left'; const x0 = M - (w1 + w2) / 2; g.fillText('…\u202f', x0, 800); g.fillStyle = ACC; g.fillText('?', x0 + w1, 800);
    live(705, 300, 46);
  } else if (v === 'B') {   // la planète avec des anneaux, dans le viseur
    night(); earth(M, M + 10, 235, true); reticle(185, 115, 16); live(690, 275, 44);
  } else {   // le viseur et un grand point d'interrogation
    g.fillStyle = '#05070c'; g.fillRect(0, 0, S, S);
    const gr = g.createRadialGradient(M, M, 40, M, M, 520); gr.addColorStop(0, 'rgba(255,190,90,0.20)'); gr.addColorStop(1, 'rgba(255,190,90,0)'); g.fillStyle = gr; g.fillRect(0, 0, S, S);
    reticle(215, 120, 16);
    g.textAlign = 'center'; g.fillStyle = ACC; g.font = 'italic 400 600px Garamond'; g.fillText('?', M + 10, 790);
    g.fillStyle = '#fff'; g.font = '600 64px Inter'; g.letterSpacing = '18px'; g.fillText('ET SI', M + 9, 335);
  }
  window.done = true;
})();
</script></body></html>
